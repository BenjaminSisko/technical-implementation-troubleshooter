name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile helpers
        run: python -m py_compile scripts/*.py tests/*.py
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate source registry
        run: python scripts/validate_source_registry.py references/source-registry.json
      - name: Check public-tree boundaries
        run: python scripts/check_public_tree.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
